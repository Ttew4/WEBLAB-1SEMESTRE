<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela + Aura</title>
</head>

<body>
    <table border="1" style="width:50%">
        <thead colspan="2">
            <h1>Tabela Informativa</h1>
        </thead>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
            <th>Avaliação I</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fernanda</td>
                <td>35</td>
                <td>Marau</td>
                <td>9.5</td>
            </tr>
            <tr>
                <td>Carlos</td>
                <td>43</td>
                <td rowspan="2">Passo Fundo</td>
                <td>6.7</td>
            </tr>
            <tr>
                <td>Ana</td>
                <td>50</td>
                <td>5.5</td>
            </tr>
            <tr>
                <td colspan="2">João, 10</td>
                <td>Porto Alegre</td>
                <td>10</td>
            </tr>
        </tbody>
        <tfoot>
            <th colspan="4">Fim da Tabela</th>
        </tfoot>
    </table>
</body>
</html>
