<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechShop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <a href="#" class="logo">TechShop</a>
    <nav>
      <a href="#">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- GRID DE PRODUTOS -->
  <main class="produtos" id="produtos">
    <h2>Produtos</h2>

    <div class="grid">

      <div class="card">
        <div class="card-img">
          <img src="assets/iphone17.webp" alt="iPhone 17" />
        </div>
        <h3>iPhone 17</h3>
        <p>R$ 7.499,00</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <div class="card-img">
          <img src="assets/samsung.webp" alt="Samsung Galaxy S25" />
        </div>
        <h3>Samsung Galaxy S25</h3>
        <p>R$ 5.299,00</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <div class="card-img">
          <img src="assets/galaxy.webp" alt="Samsung Galaxy A55" />
        </div>
        <h3>Samsung Galaxy A55</h3>
        <p>R$ 2.499,00</p>
        <button>Comprar</button>
      </div>

      <div class="card">
        <div class="card-img">
          <img src="assets/huawey.webp" alt="Huawei P60 Pro" />
        </div>
        <h3>Huawei P60 Pro</h3>
        <p>R$ 4.199,00</p>
        <button>Comprar</button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p><strong>TechShop</strong></p>
    <p>📧 contato@techshop.com &nbsp;|&nbsp; 📞 (11) 9999-9999 &nbsp;|&nbsp; 📍 São Paulo, SP</p>
    <p>© 2026 TechShop</p>
  </footer>

</body>
</html>
